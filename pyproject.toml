[project]
name = "release-foundation"
version = "0.0.1"
description = "Amortized simulation-based inference for drug release dynamics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchdiffeq>=0.2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "sbi>=0.23",
    "hydra-core>=1.3",
    "pytorch-lightning>=2.4",
    "wandb>=0.18",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",
    "lightgbm",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["*.py", "scripts", "tests"]
exclude = ["outputs", "data", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
